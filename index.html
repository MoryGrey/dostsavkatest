<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Престиж Экспресс — Доставка напитков, Геническ</title>
    <meta name="description" content="Престиж Экспресс — быстрая доставка напитков в городе Геническ. Алкоголь, пиво, безалкогольные.">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <header class="app-header safe-top">
            <button class="icon-btn" aria-label="Позвонить">📞</button>
            <div class="address-group">
                <div class="brand">Престиж Экспресс</div>
                <div class="address">Геническ</div>
            </div>
            <button class="icon-btn" aria-label="Поиск" id="open-search">🔍</button>
        </header>

        <main class="content">
            <section class="section">
                <h2 class="section-title">Категории</h2>
                <div class="cards-grid">
                    <a class="card card--beer reveal" href="#" data-name="Пиво">
                        <span class="card-title">Пиво</span>
                        <img loading="lazy" src="pivo.png" alt="Пиво">
                    </a>
                    <a class="card card--vodka reveal" href="#" data-name="Водка">
                        <span class="card-title">Водка</span>
                        <img loading="lazy" src="vodka.png" alt="Водка">
                    </a>
                    <a class="card card--whisky reveal" href="#" data-name="Виски">
                        <span class="card-title">Виски</span>
                        <img loading="lazy" src="visky.png" alt="Виски">
                    </a>
                    <a class="card card--cognac reveal" href="#" data-name="Коньяк">
                        <span class="card-title">Коньяк</span>
                        <img loading="lazy" src="https://images.unsplash.com/photo-1613478223720-b0d0b9d6e253?q=80&w=600&auto=format&fit=crop" alt="Коньяк">
                    </a>
                    <a class="card card--wine reveal" href="#" data-name="Вино">
                        <span class="card-title">Вино</span>
                        <img loading="lazy" src="vino.png" alt="Вино">
                    </a>
                    <a class="card card--snacks reveal" href="#" data-name="Закуски">
                        <span class="card-title">Закуски</span>
                        <img loading="lazy" src="zakus.png" alt="Закуски">
                    </a>
                </div>
            </section>
            <section class="section">
                <h2 class="section-title">Дополнительно</h2>
                <div class="cards-grid">
                    <a class="card card--cigs reveal" href="#" data-name="Сигареты">
                        <span class="card-title">Сигареты</span>
                        <img loading="lazy" src="sigi.png" alt="Сигареты">
                    </a>
                    <a class="card card--ecigs reveal" href="#" data-name="Электронные сигареты">
                        <span class="card-title">Электронные сигареты</span>
                        <img loading="lazy" src="sigi2.png" alt="Электронные сигареты">
                    </a>
                </div>
            </section>
        </main>

        <nav class="bottom-nav safe-bottom">
            <a href="#" class="nav-item active">🏠<span>Главная</span></a>
            <a href="#" class="nav-item">❤️<span>Избранное</span></a>
            <a href="#" class="nav-item cart" id="open-cart">🛒<span>Корзина</span><b class="badge" id="cart-badge">0</b></a>
            <button class="nav-item order-btn" id="order-btn">📞<span>Заказать</span></button>
        </nav>
    </div>

    <div class="search-sheet" id="search-sheet" hidden>
        <div class="sheet-backdrop" data-close></div>
        <div class="sheet">
            <input type="search" placeholder="Поиск напитков" class="search-input" autofocus>
            <button class="sheet-close" data-close>Закрыть</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
